[package]
name = "zelefy_gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
zelefy_common = { workspace = true }
zelefy_backend = { workspace = true }

axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }

tokio = { workspace = true }

redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "util"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
