[package]
name = "desktop-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

include_dir = "0.7.4"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.40.2", features = [
    "bundled",
    "chrono",
    "serde_json",
    "uuid",
] }
rusqlite_migration = { version = "2.6.0", features = ["from-directory"] }

zelefy_common = { workspace = true }
thiserror = "2.0.21"
strum = { workspace = true, features = ["derive"] }
dunce = "1.0.5"

audio-core = { workspace = true }
rodio = "0.23.0"
