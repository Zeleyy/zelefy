[package]
name = "desktop-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true, features = ["derive"] }

include_dir = "0.7.4"
rusqlite = { version = "0.41.1", features = [
    "bundled",
    "chrono",
    "serde_json",
    "uuid",
    "functions",
] }
rusqlite_migration = { version = "2.7.0", features = ["from-directory"] }
thiserror = "2.0.21"
dunce = "1.0.5"
rodio = "0.23.0"

zelefy_common = { workspace = true }
audio-core = { workspace = true }
