[workspace]
members = ["app/src-tauri", "core"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

uuid = "1.29.0"
chrono = "0.4.45"
strum = "0.28.0"

zelefy_common = { path = "../../packages/shared-rs/common" }
audio-core = { path = "../../packages/shared-rs/audio-core" }
desktop-core = { path = "core" }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
