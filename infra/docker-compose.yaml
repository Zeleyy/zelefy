services:
    gateway:
        build:
            context: ..
            dockerfile: apps/Dockerfile.rust
            args:
                APP_DIR: gateway
                BIN_NAME: zelefy_gateway
        ports:
            - "${GATEWAY_PORT}:${GATEWAY_PORT}"
        environment:
            PORT: ${GATEWAY_PORT}
            URL: ${GATEWAY_PUBLIC_URL}
            CACHE_URL: ${SESSION_CACHE_URL}
            AUTH_URL: ${AUTH_URL}
            PROFILES_URL: ${PROFILES_URL}
            TRACKS_URL: ${TRACKS_URL}
        depends_on:
            - session_cache

    auth:
        build:
            context: ..
            dockerfile: apps/Dockerfile.rust
            args:
                APP_DIR: auth
                BIN_NAME: zelefy_auth
        ports:
            - "${AUTH_PORT}:${AUTH_PORT}"
        environment:
            PORT: ${AUTH_PORT}
            DATABASE_URL: ${AUTH_DB_URL}
            CACHE_URL: ${SESSION_CACHE_URL}
            ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS}
            REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
        depends_on:
            - auth_db
            - session_cache

    auth_db:
        image: postgres:18-alpine
        restart: unless-stopped
        ports:
            - "${AUTH_DB_PORT}:5432"
        environment:
            POSTGRES_USER: ${AUTH_DB_USER}
            POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
            POSTGRES_DB: ${AUTH_DB}
        volumes:
            - auth_db_data:/var/lib/postgresql

    session_cache:
        image: valkey/valkey:9.0-alpine
        restart: unless-stopped
        ports:
            - "${SESSION_CACHE_PORT}:6379"
        volumes:
            - session_cache_data:/data

    profiles:
        build:
            context: ..
            dockerfile: apps/Dockerfile.rust
            args:
                APP_DIR: profiles
                BIN_NAME: zelefy_profiles
        ports:
            - "${PROFILES_PORT}:${PROFILES_PORT}"
        environment:
            PORT: ${PROFILES_PORT}
            DATABASE_URL: ${PROFILES_DB_URL}
            S3_URL: ${S3_URL}
            S3_BUCKET: ${S3_BUCKET}
            S3_PUBLIC_URL: ${S3_PUBLIC_URL}
            S3_REGION: ${S3_REGION}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}
        depends_on:
            - profiles_db
            - s3_storage

    profiles_db:
        image: postgres:18-alpine
        restart: unless-stopped
        ports:
            - "${PROFILES_DB_PORT}:5432"
        environment:
            POSTGRES_USER: ${PROFILES_DB_USER}
            POSTGRES_PASSWORD: ${PROFILES_DB_PASSWORD}
            POSTGRES_DB: ${PROFILES_DB}
        volumes:
            - profiles_db_data:/var/lib/postgresql

    tracks:
        build:
            context: ..
            dockerfile: apps/Dockerfile.rust
            args:
                APP_DIR: tracks
                BIN_NAME: zelefy_tracks
        ports:
            - "${TRACKS_PORT}:${TRACKS_PORT}"
        environment:
            PORT: ${TRACKS_PORT}
            DATABASE_URL: ${TRACKS_DB_URL}
            S3_URL: ${S3_URL}
            S3_BUCKET: ${S3_BUCKET}
            S3_PUBLIC_URL: ${S3_PUBLIC_URL}
            S3_REGION: ${S3_REGION}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}
        depends_on:
            - tracks_db
            - s3_storage

    tracks_db:
        image: postgres:18-alpine
        restart: unless-stopped
        ports:
            - "${TRACKS_DB_PORT}:5432"
        environment:
            POSTGRES_USER: ${TRACKS_DB_USER}
            POSTGRES_PASSWORD: ${TRACKS_DB_PASSWORD}
            POSTGRES_DB: ${TRACKS_DB}
        volumes:
            - tracks_db_data:/var/lib/postgresql

    s3_storage:
        image: dxflrs/garage:v2.4.1
        restart: unless-stopped
        ports:
            - "${S3_API_PORT}:3900"
            - "${S3_WEB_PORT}:3902"
            - "127.0.0.1:${S3_ADMIN_PORT}:3903"
        volumes:
            - ./garage.toml:/etc/garage.toml
            - s3_storage_meta:/var/lib/garage/meta
            - s3_storage_data:/var/lib/garage/data

    garage-webui:
        image: khairul169/garage-webui:latest
        restart: unless-stopped
        ports:
            - "${S3_WEBUI_PORT}:3909"
        environment:
            API_BASE_URL: ${S3_ADMIN_URL}
            S3_ENDPOINT_URL: ${S3_INTERNAL_URL}
        volumes:
            - ./garage.toml:/etc/garage.toml:ro
        depends_on:
            - s3_storage

volumes:
    auth_db_data:
    session_cache_data:

    profiles_db_data:

    tracks_db_data:

    s3_storage_meta:
    s3_storage_data:
