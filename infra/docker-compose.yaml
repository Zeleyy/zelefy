services:
    gateway:
        build:
            context: ..
            dockerfile: apps/gateway/Dockerfile
        ports:
            - "${GATEWAY_PORT}:${GATEWAY_PORT}"
        environment:
            - PORT=${GATEWAY_PORT}
            - URL=${GATEWAY_PUBLIC_URL}
            - REDIS_URL=${AUTH_REDIS_URL}
            - AUTH_URL=${AUTH_URL}
            - PROFILES_URL=${PROFILES_URL}
        depends_on:
            - redis_sessions

    auth:
        build:
            context: ..
            dockerfile: apps/auth/Dockerfile
        ports:
            - "${AUTH_PORT}:${AUTH_PORT}"
        environment:
            - PORT=${AUTH_PORT}
            - DATABASE_URL=${AUTH_DB_URL}
            - REDIS_URL=${AUTH_REDIS_URL}
            - ACCESS_TOKEN_TTL_SECONDS=${ACCESS_TOKEN_TTL_SECONDS}
            - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS}
        depends_on:
            - auth_db
            - redis_sessions

    auth_db:
        image: postgres:18-alpine
        restart: unless-stopped
        ports:
            - "${AUTH_DB_PORT}:5432"
        environment:
            POSTGRES_USER: ${AUTH_DB_USER}
            POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
            POSTGRES_DB: ${AUTH_DB}
        volumes:
            - auth_db_data:/var/lib/postgresql

    redis_sessions:
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            - "${AUTH_REDIS_PORT}:6379"
        volumes:
            - redis_sessions_data:/data

    profiles:
        build:
            context: ..
            dockerfile: apps/profiles/Dockerfile
        ports:
            - "${PROFILES_PORT}:${PROFILES_PORT}"
        environment:
            - PORT=${PROFILES_PORT}
            - DATABASE_URL=${PROFILES_DB_URL}
            - S3_URL=${S3_URL}
            - S3_BUCKET=${S3_BUCKET}
            - S3_PUBLIC_URL=${S3_PUBLIC_URL}
            - S3_REGION=${S3_REGION}
            - S3_ACCESS_KEY=${S3_ACCESS_KEY}
            - S3_SECRET_KEY=${S3_SECRET_KEY}
        depends_on:
            - profiles_db
            - s3_storage

    profiles_db:
        image: postgres:18-alpine
        restart: unless-stopped
        ports:
            - "${PROFILES_DB_PORT}:5432"
        environment:
            POSTGRES_USER: ${PROFILES_DB_USER}
            POSTGRES_PASSWORD: ${PROFILES_DB_PASSWORD}
            POSTGRES_DB: ${PROFILES_DB}
        volumes:
            - profiles_db_data:/var/lib/postgresql

    tracks:
        build:
            context: ..
            dockerfile: apps/tracks/Dockerfile
        ports:
            - "${TRACKS_PORT}:${TRACKS_PORT}"
        environment:
            - PORT=${TRACKS_PORT}
            - DATABASE_URL=${TRACKS_DB_URL}
            - S3_URL=${S3_URL}
            - S3_BUCKET=${S3_BUCKET}
            - S3_PUBLIC_URL=${S3_PUBLIC_URL}
            - S3_REGION=${S3_REGION}
            - S3_ACCESS_KEY=${S3_ACCESS_KEY}
            - S3_SECRET_KEY=${S3_SECRET_KEY}
        depends_on:
            - tracks_db
            - s3_storage

    tracks_db:
        image: postgres:18-alpine
        restart: unless-stopped
        ports:
            - "${TRACKS_DB_PORT}:5432"
        environment:
            POSTGRES_USER: ${TRACKS_DB_USER}
            POSTGRES_PASSWORD: ${TRACKS_DB_PASSWORD}
            POSTGRES_DB: ${TRACKS_DB}
        volumes:
            - tracks_db_data:/var/lib/postgresql

    s3_storage:
        image: dxflrs/garage:v2.4.1
        restart: unless-stopped
        ports:
            - "${S3_API_PORT}:3900"
            - "${S3_WEB_PORT}:3902"
            - "127.0.0.1:${S3_ADMIN_PORT}:3903"
        volumes:
            - ./garage.toml:/etc/garage.toml
            - s3_storage_meta:/var/lib/garage/meta
            - s3_storage_data:/var/lib/garage/data

    garage-webui:
        image: khairul169/garage-webui:latest
        restart: unless-stopped
        ports:
            - "${S3_WEBUI_PORT}:3909"
        environment:
            - API_BASE_URL=${S3_ADMIN_URL}
            - S3_ENDPOINT_URL=${S3_INTERNAL_URL}
        volumes:
            - ./garage.toml:/etc/garage.toml:ro
        depends_on:
            - s3_storage

volumes:
    auth_db_data:
    redis_sessions_data:

    profiles_db_data:

    tracks_db_data:

    s3_storage_meta:
    s3_storage_data:
