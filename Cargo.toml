[workspace]
members = [
    "apps/auth",
    "apps/gateway",
    "apps/profiles",
    "apps/tracks",
    "apps/desktop/src-tauri",
    "apps/desktop/core",
    "packages/shared-rs/common",
    "packages/shared-rs/backend",
    "packages/shared-rs/error-derive",
]
resolver = "2"


[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.25.0", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
bytes = "1.12.1"
thiserror = "2.0.20"

dotenvy = "0.15.7"
envy = "0.4.2"

tokio = { version = "1.53.1", features = ["full"] }

tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.7.1", features = ["trace", "request-id"] }
axum = { version = "0.8.9", features = ["multipart"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "reqwest", "vendored"] }

sqlx = { version = "0.9.0", features = ["postgres", "uuid", "derive", "chrono", "ipnetwork", "runtime-tokio", "tls-rustls"] }
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
aws-sdk-s3 = { version = "1.146.1", features = ["behavior-version-latest"]}

zelefy_common = { path = "packages/shared-rs/common", features = ["backend"] }
zelefy_backend = { path = "packages/shared-rs/backend" }


[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
