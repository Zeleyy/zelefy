[workspace]
members = [
    "apps/auth",
    "apps/gateway",
    "packages/shared-rs/common",
    "packages/shared-rs/backend"
]
resolver = "2"


[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.25.0", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }

dotenvy = "0.15.7"

tokio = { version = "1.53.1", features = ["full"] }

axum = "0.8.9"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }

sqlx = { version = "0.9.0", features = ["postgres", "uuid", "derive", "chrono", "ipnetwork", "runtime-tokio", "tls-rustls"] }

zelefy_common = { path = "packages/shared-rs/common", features = ["backend"] }
zelefy_backend = { path = "packages/shared-rs/backend" }


[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
